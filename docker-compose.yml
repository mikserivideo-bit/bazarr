services:
  bazarr-luka:
    image: bazarr-luka:latest
    build:
      context: .
      dockerfile: Dockerfile.portainer
    container_name: bazarr-luka
    environment:
      PUID: 1000
      PGID: 10
      TZ: Europe/Zagreb
    volumes:
      - /volume1/docker/bazarr-luka:/config
      - /volume2:/data
    ports:
      - "6768:6767"
    restart: unless-stopped
